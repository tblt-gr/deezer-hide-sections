name: Package Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from manifest
        id: get_version
        run: |
          VERSION=$(grep '"version":' manifest.json | cut -d'"' -f4)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create ZIP archive
        run: |
          zip -r "deezer-hide-sections-${VERSION}.zip" . \
            -x ".git/*" \
               ".github/*" \
               "*.md" \
               ".gitignore" \
               "*.zip"

      - name: Build changelog
        id: changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
          else
            RANGE="${CURRENT_TAG}"
          fi

          ADDED=$(git log $RANGE --pretty=format:"%s" | grep -E "^feat(\(.+\))?:" | sed -E "s/^feat(\(.+\))?: ?/- /")
          FIXED=$(git log $RANGE --pretty=format:"%s" | grep -E "^fix(\(.+\))?:" | sed -E "s/^fix(\(.+\))?: ?/- /")

          {
            echo "## Added"
            if [ -n "$ADDED" ]; then echo "$ADDED"; else echo "_No new features._"; fi
            echo ""
            echo "## Fixed"
            if [ -n "$FIXED" ]; then echo "$FIXED"; else echo "_No fixes._"; fi
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"
            fi
          } > CHANGELOG_RELEASE.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: deezer-hide-sections-${{ env.VERSION }}.zip
          name: ${{ github.ref_name }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
